<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://mathnexa.com/games" />
    <title>Math Vocabulary Hunt has moved</title>
    <script>
      // Standalone GitHub Pages redirect (production bug sweep BS-07B3).
      // The public standalone copy of Math Vocabulary Hunt is retired; the game
      // lives in MathNexa Games. Every legacy path goes to the same constant
      // destination: nothing from the URL (pathname, query string or fragment)
      // is read, so nothing user-controlled can influence where a visitor goes.
      (function () {
        var TARGET = "https://mathnexa.com/games";
        if (typeof window === "undefined") return;
        if (window.__MVH_REDIRECT_TEST__ === true) {
          window.__mvhRedirectTarget = TARGET;
          return;
        }
        window.location.replace(TARGET);
      })();
    </script>
    <meta http-equiv="refresh" content="1; url=https://mathnexa.com/games" />
    <style>
      html {
        background: #f6f3ee;
        color: #14213d;
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        box-sizing: border-box;
      }
      main {
        max-width: 34rem;
        text-align: center;
      }
      h1 {
        font-size: 1.75rem;
        line-height: 1.25;
        margin: 0 0 0.75rem;
      }
      p {
        font-size: 1.05rem;
        line-height: 1.5;
        margin: 0 0 1rem;
      }
      a {
        display: inline-block;
        min-height: 44px;
        line-height: 44px;
        padding: 0 1.25rem;
        border-radius: 8px;
        background: #0f5c5a;
        color: #ffffff;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #14213d;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>This standalone version has moved.</h1>
      <p>Math Vocabulary Hunt is now part of MathNexa Games. You will be taken there automatically.</p>
      <p><a href="https://mathnexa.com/games">Continue to MathNexa Games</a></p>
    </main>
  </body>
</html>
